<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Lamp Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0f0c20;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Lock Screen Styling */
        #lock-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .lamp-box {
            position: relative;
            margin-bottom: 25px;
            text-align: center;
        }

        .lamp-icon {
            font-size: 70px;
            filter: drop-shadow(0 0 20px #ffb703);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { filter: drop-shadow(0 0 10px #ffb703); transform: scale(0.98); }
            100% { filter: drop-shadow(0 0 30px #ffb703); transform: scale(1.05); }
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            padding: 30px 25px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
            max-width: 320px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffb703;
            letter-spacing: 1px;
        }

        .input-box {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .input-box:focus {
            border-color: #ffb703;
        }

        .unlock-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ffb703, #fb8500);
            color: #000;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .unlock-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(255, 183, 3, 0.4);
        }

        #err {
            color: #ff4d4d;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        /* Gallery Screen Styling */
        #gallery-screen {
            display: none;
            width: 100%;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px 50px 10px;
            background-color: #000;
        }

        .photo-list {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .photo-list img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.08);
            background: #111;
        }
    </style>
</head>
<body>

    <!-- Lamp Lock Screen -->
    <div id="lock-screen">
        <div class="lamp-box">
            <div class="lamp-icon">🪔</div>
        </div>
        <div class="card">
            <h2>SECRET ACCESS</h2>
            <input type="text" id="user" class="input-box" placeholder="Username">
            <input type="password" id="pass" class="input-box" placeholder="Password">
            <button class="unlock-btn" onclick="login()">LOGIN</button>
            <div id="err">Wrong Username or Password!</div>
        </div>
    </div>

    <!-- Continuous Scroll Gallery -->
    <div id="gallery-screen">
        <div class="photo-list">
            <img src="https://i.postimg.cc/9F4P61sQ/1000103435.jpg" crossorigin="anonymous" alt="Photo 1">
            <img src="https://i.postimg.cc/T3sL3wP0/1000106108.jpg" crossorigin="anonymous" alt="Photo 2">
            <img src="https://i.postimg.cc/vTjvwVbV/1000098028.jpg" crossorigin="anonymous" alt="Photo 3">
            <img src="https://i.postimg.cc/Bn7sD2r0/1000103465.png" crossorigin="anonymous" alt="Photo 4">
            <img src="https://i.postimg.cc/mD7tB0xR/1000103780.png" crossorigin="anonymous" alt="Photo 5">
            <img src="https://i.postimg.cc/Vv3S5Znd/1000103773.jpg" crossorigin="anonymous" alt="Photo 6">
            <img src="https://i.postimg.cc/0j0vL1W0/1000103462.png" crossorigin="anonymous" alt="Photo 7">
            <img src="https://i.postimg.cc/kg7vR1V0/1000103464.png" crossorigin="anonymous" alt="Photo 8">
            <img src="https://i.postimg.cc/Hn8q4Y22/1000103463.png" crossorigin="anonymous" alt="Photo 9">
        </div>
    </div>

    <script>
        function login() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            
            if (u === "Kakashi" && p === "altmash12") {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('gallery-screen').style.display = 'flex';
                document.body.style.background = "#000";
            } else {
                document.getElementById('err').style.display = 'block';
            }
        }
    </script>
</body>
</html>
