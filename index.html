<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamp Lock Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Lock Screen Layout */
        #lock-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .lamp-icon {
            font-size: 60px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px #ffbd59);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 5px #ffbd59); }
            to { filter: drop-shadow(0 0 20px #ffbd59); }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .login-card h2 {
            margin-bottom: 20px;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        .input-field:focus {
            border-color: #ffbd59;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #ffbd59, #ff914d);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 189, 89, 0.4);
        }

        #error-msg {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* Full Screen Vertical Scroll Gallery */
        #gallery-screen {
            display: none;
            width: 100%;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            padding: 15px 10px 40px 10px;
            background-color: #000;
        }

        .gallery-container {
            width: 100%;
            max-width: 550px; /* Big full-width vertical view */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .gallery-container img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <!-- Lock Screen Section -->
    <div id="lock-screen">
        <div class="lamp-icon">🪔</div>
        <div class="login-card">
            <h2>Enter Secret Key</h2>
            <input type="text" id="username" class="input-field" placeholder="Username">
            <input type="password" id="password" class="input-field" placeholder="Password">
            <button class="btn-login" onclick="checkLogin()">Unlock Gallery</button>
            <div id="error-msg">Incorrect Username or Password!</div>
        </div>
    </div>

    <!-- Gallery Section -->
    <div id="gallery-screen">
        <div class="gallery-container">
            <img src="https://i.postimg.cc/9F4P61sQ/1000103435.jpg" alt="Photo 1">
            <img src="https://i.postimg.cc/T3sL3wP0/1000106108.jpg" alt="Photo 2">
            <img src="https://i.postimg.cc/vTjvwVbV/1000098028.jpg" alt="Photo 3">
            <img src="https://i.postimg.cc/Bn7sD2r0/1000103465.png" alt="Photo 4">
            <img src="https://i.postimg.cc/mD7tB0xR/1000103780.png" alt="Photo 5">
            <img src="https://i.postimg.cc/Vv3S5Znd/1000103773.jpg" alt="Photo 6">
            <img src="https://i.postimg.cc/0j0vL1W0/1000103462.png" alt="Photo 7">
            <img src="https://i.postimg.cc/kg7vR1V0/1000103464.png" alt="Photo 8">
            <img src="https://i.postimg.cc/Hn8q4Y22/1000103463.png" alt="Photo 9">
        </div>
    </div>

    <script>
        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            // Set login credentials
            if (user === "Kakashi" && pass === "altmash12") {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('gallery-screen').style.display = 'flex';
                document.body.style.backgroundColor = "#000";
            } else {
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
